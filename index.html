<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/pixel/home.svg" />
    <link rel="preload" href="./fonts/fusion-pixel-12px-zh-hans.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#10141b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('easy-cc-theme') || '"dark"');
        document.documentElement.dataset.theme = theme === 'adventure' ? 'adventure' : 'dark';
        if (theme === 'adventure') document.querySelector('meta[name="theme-color"]').content = '#f5e7c9';
      } catch (_) {}
    </script>
    <title>不咕鸟龙与地下城线下团辅助工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              dndRed: '#E0C38E',
              parchment: '#1B222C',
              parchmentDark: '#252F3D',
              slate: '#10141B'
            },
            fontFamily: {
              serif: ['"Fusion Pixel"', 'monospace'],
              sans: ['"Fusion Pixel"', 'monospace'],
              mono: ['"Fusion Pixel"', 'monospace'],
              pixel: ['"Fusion Pixel"', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
  <body class="font-pixel">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
